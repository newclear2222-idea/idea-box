<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191d">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IDEA BOX">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>IDEA BOX</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#777d87;--line:#e5e7eb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:28px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:27px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}button,input,textarea,select{font:inherit}
button{border:0;border-radius:11px;padding:11px 14px;cursor:pointer}.primary{background:#17191d;color:white}.ghost{background:white;border:1px solid var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:180px;padding:12px;border:1px solid var(--line);border-radius:11px;background:white}
select{padding:11px;border:1px solid var(--line);border-radius:11px;background:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.cardtop{display:flex;justify-content:space-between;gap:10px}.title{font-weight:700;font-size:17px}
.star{background:none;padding:0;font-size:21px;color:#bbb}.star.on{color:#f3ad16}.content{white-space:pre-wrap;color:#484d55;font-size:14px;line-height:1.55;margin:10px 0 15px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.badge{background:#f1f2f4;padding:5px 8px;border-radius:999px}
.actions{margin-left:auto}.small{background:none;color:var(--muted);padding:5px}.empty{text-align:center;color:var(--muted);padding:65px 10px}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));max-height:90vh;box-shadow:0 25px 80px #0004}
dialog::backdrop{background:#0006}.form{padding:22px}.form h2{margin:0 0 16px}.field{margin:11px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.field textarea{min-height:140px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.foot{font-size:12px;color:var(--muted);margin-top:18px}
.fab{display:none;position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 8px 24px #0004}
@media(max-width:650px){.wrap{padding:20px 14px 95px}.grid{grid-template-columns:1fr}.desktopAdd{display:none}.fab{display:block}.row{grid-template-columns:1fr}.toolbar .ghost{padding:10px}.card{border-radius:14px}dialog{width:calc(100% - 18px)}}
</style></head><body>
<div class="wrap"><header><div><h1>IDEA BOX</h1><div class="sub">떠오른 생각을 바로 저장하세요.</div></div><button class="primary desktopAdd" id="newBtn">+ 새 아이디어</button></header>
<div class="toolbar"><input id="search" class="search" placeholder="아이디어 검색..."><select id="filter"><option value="">전체 상태</option><option>아이디어</option><option>검토중</option><option>제작중</option><option>실행</option><option>보류</option></select><button class="ghost" id="backupBtn">백업</button><button class="ghost" id="restoreBtn">복원</button><input id="importFile" type="file" accept=".json" hidden></div>
<div id="list" class="grid"></div><div class="foot"><span id="count"></span> · 이 기기의 브라우저에 자동 저장됩니다.</div></div>
<button class="primary fab" id="fab" aria-label="새 아이디어">+</button>
<dialog id="dlg"><form id="ideaForm" class="form"><h2 id="formTitle">새 아이디어</h2><input type="hidden" id="editId">
<div class="field"><label>제목</label><input id="title" maxlength="100" required placeholder="아이디어 제목"></div>
<div class="field"><label>내용</label><textarea id="content" placeholder="자유롭게 적어보세요."></textarea></div>
<div class="row"><div class="field"><label>분류</label><input id="category" maxlength="30" placeholder="학원, 사업, AI 등"></div><div class="field"><label>상태</label><select id="status"><option>아이디어</option><option>검토중</option><option>제작중</option><option>실행</option><option>보류</option></select></div></div>
<div class="formactions"><button type="button" class="ghost" id="cancelBtn">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>
<script>
"use strict";
const KEY="idea_box_v2";
let ideas=[];
try{ideas=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("idea_box_v1")||"[]");if(!Array.isArray(ideas))ideas=[]}catch(e){ideas=[]}
const $=id=>document.getElementById(id), dlg=$("dlg");
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(ideas));return true}catch(e){alert("저장하지 못했습니다. 브라우저 저장공간 설정을 확인해주세요.");return false}};
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function openForm(id=""){let x=ideas.find(i=>i.id===id);$("editId").value=id;$("formTitle").textContent=x?"아이디어 수정":"새 아이디어";$("title").value=x?.title||"";$("content").value=x?.content||"";$("category").value=x?.category||"";$("status").value=x?.status||"아이디어";dlg.showModal();setTimeout(()=>$("title").focus(),50)}
$("ideaForm").addEventListener("submit",e=>{e.preventDefault();let id=$("editId").value, data={title:$("title").value.trim(),content:$("content").value.trim(),category:$("category").value.trim(),status:$("status").value};if(!data.title)return;
if(id){let x=ideas.find(i=>i.id===id);if(x)Object.assign(x,data,{updated:new Date().toISOString()})}else{ideas.unshift({id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()),...data,star:false,created:new Date().toISOString()})}
if(persist()){dlg.close();render()}});
function toggleStar(id){let x=ideas.find(i=>i.id===id);if(x){x.star=!x.star;persist();render()}}
function removeIdea(id){if(confirm("이 아이디어를 삭제할까요?")){ideas=ideas.filter(i=>i.id!==id);persist();render()}}
function render(){let q=$("search").value.trim().toLowerCase(),f=$("filter").value;let a=ideas.filter(i=>(!f||i.status===f)&&(!q||[i.title,i.content,i.category,i.status].join(" ").toLowerCase().includes(q))).sort((a,b)=>Number(b.star)-Number(a.star)||new Date(b.created)-new Date(a.created));
$("count").textContent=`아이디어 ${a.length}개`;$("list").innerHTML=a.length?a.map(i=>`<div class="card"><div class="cardtop"><div class="title">${esc(i.title)}</div><button class="star ${i.star?"on":""}" data-star="${i.id}">★</button></div><div class="content">${esc(i.content)||'<span style="color:#aaa">내용 없음</span>'}</div><div class="meta">${i.category?`<span class="badge">${esc(i.category)}</span>`:""}<span class="badge">${esc(i.status)}</span><span>${new Date(i.created).toLocaleDateString("ko-KR")}</span><div class="actions"><button class="small" data-edit="${i.id}">수정</button><button class="small" data-del="${i.id}">삭제</button></div></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">아직 저장된 아이디어가 없습니다.<br><br><button class="primary" id="firstBtn">첫 아이디어 적기</button></div>`;
$("firstBtn")?.addEventListener("click",()=>openForm());document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>toggleStar(b.dataset.star));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>removeIdea(b.dataset.del))}
$("newBtn").onclick=$("fab").onclick=()=>openForm();$("cancelBtn").onclick=()=>dlg.close();$("search").oninput=render;$("filter").onchange=render;
$("backupBtn").onclick=()=>{let blob=new Blob([JSON.stringify({version:2,ideas},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="idea-box-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$("restoreBtn").onclick=()=>$("importFile").click();$("importFile").onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),x=Array.isArray(d)?d:d.ideas;if(!Array.isArray(x))throw 0;if(confirm(`백업의 아이디어 ${x.length}개로 현재 데이터를 교체할까요?`)){ideas=x;persist();render()}}catch(e){alert("올바른 IDEA BOX 백업 파일이 아닙니다.")}e.target.value=""};r.readAsText(file)};
render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
