<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IDEA BOX">
<title>IDEA BOX</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#777d87;--line:#e5e7eb;--accent:#222}
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:0 auto;padding:38px 20px 70px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:28px;margin:0;letter-spacing:-1px}.sub{font-size:13px;color:var(--muted);margin-top:5px}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}
.primary{background:#17191d;color:#fff}.ghost{background:#fff;border:1px solid var(--line)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
select{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.025)}
.cardtop{display:flex;justify-content:space-between;gap:12px}.title{font-weight:700;font-size:17px;word-break:break-word}
.star{background:transparent;padding:0;font-size:21px;color:#bbb}.star.on{color:#f3ad16}
.content{white-space:pre-wrap;color:#454a52;font-size:14px;line-height:1.55;margin:11px 0 16px;word-break:break-word}
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.badge{background:#f1f2f4;padding:5px 8px;border-radius:999px}
.actions{margin-left:auto;display:flex;gap:5px}.small{padding:5px 7px;background:transparent;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:70px 10px}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 28px));box-shadow:0 25px 80px rgba(0,0,0,.22)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.form{padding:24px}.form h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}
.field textarea{min-height:150px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.foot{margin-top:22px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding-top:25px}}

.fab{display:none;position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;background:#17191d;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:20;padding:0}
@media(max-width:650px){
 body{background:#fff}.wrap{padding:calc(18px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom));max-width:none}
 header{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:10;margin:0 -14px 15px;padding:8px 14px 12px;border-bottom:1px solid var(--line)}
 header .primary{display:none} h1{font-size:23px}.sub{font-size:12px}.toolbar{position:sticky;top:72px;background:#fff;z-index:9;padding:0 0 10px;margin-bottom:8px}
 .search{width:100%;flex-basis:100%;font-size:16px}.toolbar select{flex:1}.toolbar .ghost{padding:10px 12px}
 .grid{grid-template-columns:1fr;gap:10px}.card{border-radius:14px;padding:15px;box-shadow:none}.content{font-size:15px}.title{font-size:17px}
 .fab{display:block} dialog{width:100%;max-width:none;margin:auto 0 0 0;border-radius:20px 20px 0 0;max-height:92vh}.form{padding:22px 18px calc(22px + env(safe-area-inset-bottom))}.field input,.field textarea,.field select{font-size:16px}.field textarea{min-height:180px}
 .foot{padding-bottom:10px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>IDEA BOX</h1><div class="sub">떠오른 생각을 잊기 전에 저장하세요.</div></div>
  <button class="primary" onclick="openForm()">+ 새 아이디어</button>
</header>

<div class="toolbar">
  <input id="search" class="search" placeholder="아이디어 검색..." oninput="render()">
  <select id="filter" onchange="render()">
    <option value="">전체 상태</option><option>아이디어</option><option>검토중</option><option>제작중</option><option>실행</option><option>보류</option>
  </select>
  <button class="ghost" onclick="exportData()">백업</button>
  <button class="ghost" onclick="document.getElementById('importFile').click()">복원</button>
  <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
</div>

<div id="list" class="grid"></div>
<div class="foot"><span id="count"></span><span>이 브라우저에 자동 저장됩니다.</span></div>
</div>
<button class="fab" aria-label="새 아이디어" onclick="openForm()">+</button>

<dialog id="dlg">
<form class="form" onsubmit="saveIdea(event)">
<h2 id="formTitle">새 아이디어</h2>
<input type="hidden" id="editId">
<div class="field"><label>제목</label><input id="title" maxlength="100" required placeholder="예: 학원 홍보물 자동 제작"></div>
<div class="field"><label>내용</label><textarea id="content" placeholder="아이디어를 자유롭게 적어보세요."></textarea></div>
<div class="row">
  <div class="field"><label>분류</label><input id="category" maxlength="30" placeholder="예: 학원, 사업, AI"></div>
  <div class="field"><label>상태</label><select id="status"><option>아이디어</option><option>검토중</option><option>제작중</option><option>실행</option><option>보류</option></select></div>
</div>
<div class="formactions"><button type="button" class="ghost" onclick="dlg.close()">취소</button><button class="primary">저장</button></div>
</form>
</dialog>

<script>
const KEY='idea_box_v1';
let ideas=JSON.parse(localStorage.getItem(KEY)||'[]');
const dlg=document.getElementById('dlg');
function persist(){localStorage.setItem(KEY,JSON.stringify(ideas))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openForm(id=''){
  document.getElementById('editId').value=id;
  const x=ideas.find(i=>i.id===id);
  document.getElementById('formTitle').textContent=x?'아이디어 수정':'새 아이디어';
  document.getElementById('title').value=x?.title||'';
  document.getElementById('content').value=x?.content||'';
  document.getElementById('category').value=x?.category||'';
  document.getElementById('status').value=x?.status||'아이디어';
  dlg.showModal(); setTimeout(()=>document.getElementById('title').focus(),50);
}
function saveIdea(e){
  e.preventDefault();
  const id=document.getElementById('editId').value;
  const data={title:document.getElementById('title').value.trim(),content:document.getElementById('content').value.trim(),category:document.getElementById('category').value.trim(),status:document.getElementById('status').value};
  if(id){const x=ideas.find(i=>i.id===id);Object.assign(x,data,{updated:new Date().toISOString()})}
  else ideas.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),...data,star:false,created:new Date().toISOString()});
  persist();dlg.close();render();
}
function toggleStar(id){const x=ideas.find(i=>i.id===id);x.star=!x.star;persist();render()}
function removeIdea(id){if(confirm('이 아이디어를 삭제할까요?')){ideas=ideas.filter(i=>i.id!==id);persist();render()}}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.getElementById('filter').value;
  let arr=ideas.filter(i=>(!f||i.status===f)&&(!q||[i.title,i.content,i.category,i.status].join(' ').toLowerCase().includes(q)));
  arr.sort((a,b)=>(b.star-a.star)||new Date(b.created)-new Date(a.created));
  document.getElementById('count').textContent=`아이디어 ${arr.length}개`;
  document.getElementById('list').innerHTML=arr.length?arr.map(i=>`
    <div class="card">
      <div class="cardtop"><div class="title">${esc(i.title)}</div><button class="star ${i.star?'on':''}" onclick="toggleStar('${i.id}')" title="중요 표시">★</button></div>
      <div class="content">${esc(i.content)||'<span style="color:#aaa">내용 없음</span>'}</div>
      <div class="meta">
        ${i.category?`<span class="badge">${esc(i.category)}</span>`:''}
        <span class="badge">${esc(i.status)}</span>
        <span>${new Date(i.created).toLocaleDateString('ko-KR')}</span>
        <div class="actions"><button class="small" onclick="openForm('${i.id}')">수정</button><button class="small" onclick="removeIdea('${i.id}')">삭제</button></div>
      </div>
    </div>`).join(''):`<div class="empty" style="grid-column:1/-1">아직 저장된 아이디어가 없습니다.<br><br><button class="primary" onclick="openForm()">첫 아이디어 적기</button></div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:1,ideas},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='idea-box-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const incoming=Array.isArray(d)?d:d.ideas;if(!Array.isArray(incoming))throw 0;if(confirm(`백업의 아이디어 ${incoming.length}개로 현재 데이터를 교체할까요?`)){ideas=incoming;persist();render()}}catch{alert('올바른 IDEA BOX 백업 파일이 아닙니다.')}e.target.value=''};r.readAsText(file);
}
render();
</script>
</body>
</html>
